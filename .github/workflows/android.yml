name: android

on:
  workflow_dispatch:
  push:
    paths:
      - 'MultiCraft-main/**'
      - '.github/workflows/android.yml'
  pull_request:
    paths:
      - 'MultiCraft-main/**'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Install GNU gettext
        run: sudo apt-get update && sudo apt-get install -y gettext
      - name: Build release APKs
        working-directory: MultiCraft-main/Android
        run: ./gradlew assembleRelease
      - name: Upload armeabi-v7a APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-armeabi-v7a.apk
          path: MultiCraft-main/Android/app/build/outputs/apk/release/app-armeabi-v7a-release-unsigned.apk
      - name: Upload arm64-v8a APK
        uses: actions/upload-artifact@v4
        with:
          name: MultiCraft-arm64-v8a.apk
          path: MultiCraft-main/Android/app/build/outputs/apk/release/app-arm64-v8a-release-unsigned.apk